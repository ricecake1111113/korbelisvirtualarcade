<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Baldi's Fun New School Plus Ultimate Edition</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        background: black;
      }

      * {
        box-sizing: border-box;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #unity-canvas {
        width: 100vw !important;
        height: 100vh !important;
        display: block;
      }

      #unity-footer {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type == 'error') {
          div.style = 'background: red; padding: 10px;';
        } else {
          if (type == 'warning') {
            div.style = 'background: yellow; padding: 10px;';
          }
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BFNSPUE Alpha 6 Part 2b WebGL.loader.js";
      var dataFileName = "BFNSPUE Alpha 6 Part 2b WebGL.data";
      var dataChunksDir = buildUrl + "/" + dataFileName + ".chunks";
      var dataManifestUrl = buildUrl + "/" + dataFileName + ".parts.json";
      var chunkedDataObjectUrl = null;

      var config = {
        dataUrl: buildUrl + "/" + dataFileName,
        frameworkUrl: buildUrl + "/BFNSPUE Alpha 6 Part 2b WebGL.framework.js",
        codeUrl: buildUrl + "/BFNSPUE Alpha 6 Part 2b WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "JohnsterSpaceGames",
        productName: "Baldi's Fun New School Plus Ultimate Edition",
        productVersion: "0.2.5b",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        unityShowBanner('WebGL builds are not supported on mobile devices.');
      }

      canvas.style.background =
        "url('" + buildUrl + "/BFNSPUE Alpha 6 Part 2b WebGL.jpg') center / cover";

      loadingBar.style.display = "block";

      async function prepareChunkedDataUrl() {
        var manifestResponse = await fetch(dataManifestUrl, { cache: "no-store" });
        if (!manifestResponse.ok) {
          throw new Error(
            "Failed to load data parts manifest: " +
            manifestResponse.status +
            " " +
            manifestResponse.statusText
          );
        }

        var manifest = await manifestResponse.json();
        if (!manifest.parts || !manifest.parts.length) {
          throw new Error("Data manifest has no parts.");
        }

        var totalBytes = manifest.totalSize || 0;
        if (!totalBytes) {
          for (var i = 0; i < manifest.parts.length; i++) {
            totalBytes += manifest.parts[i].size || 0;
          }
        }

        var loadedBytes = 0;
        var buffers = [];

        for (var p = 0; p < manifest.parts.length; p++) {
          var part = manifest.parts[p];
          var partUrl = dataChunksDir + "/" + encodeURIComponent(part.name);
          var partResponse = await fetch(partUrl, { cache: "no-store" });

          if (!partResponse.ok) {
            throw new Error(
              "Failed to load data part " +
              part.name +
              ": " +
              partResponse.status +
              " " +
              partResponse.statusText
            );
          }

          var partBuffer = await partResponse.arrayBuffer();
          buffers.push(partBuffer);
          loadedBytes += partBuffer.byteLength;

          if (totalBytes > 0) {
            progressBarFull.style.width = (15 * (loadedBytes / totalBytes)) + "%";
          }
        }

        return URL.createObjectURL(new Blob(buffers, { type: "application/octet-stream" }));
      }

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = async () => {
        try {
          chunkedDataObjectUrl = await prepareChunkedDataUrl();
          config.dataUrl = chunkedDataObjectUrl;
        } catch (error) {
          alert(error && error.message ? error.message : error);
          return;
        }

        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (15 + (85 * progress)) + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          if (chunkedDataObjectUrl) {
            URL.revokeObjectURL(chunkedDataObjectUrl);
            chunkedDataObjectUrl = null;
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
