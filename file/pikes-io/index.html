<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>pikes.io - Korbeli's Virtual Arcade</title>

    <link rel="shortcut icon" href="style/favicon.ico">
    <link rel="stylesheet" href="style/style.css">

    <script src="UnityProgress.js"></script>
    <script src="UnityLoader.js"></script>
    <script src="ui.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: black;
        }

        /* HARD FULLSCREEN LOCK */
        .webgl-content {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* FORCE UNITY CANVAS TO FILL */
        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            inset: 0 !important;
        }

        /* REMOVE COMMON UNITY FOOTER / WATERMARK SPACE */
        .footer,
        .unity-footer,
        #unity-footer {
            display: none !important;
            height: 0 !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>

    <script>
        var gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "build.json",
            { onProgress: UnityProgress }
        );
    </script>
</head>

<body>
    <div class="webgl-content">
        <div id="gameContainer"></div>
    </div>
</body>
</html>
